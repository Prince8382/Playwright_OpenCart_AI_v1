#To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.

name: 🎭 Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:api
          - test:e2e
          - test:web
          - test:datadriven
        default: "test:api"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: ⚙️ Create .env File
        run: cp .env.example .env

      - name: 🧪 Run Playwright Tests
        run: |
          if [ "$TEST_SUITE" = "test:e2e" ]; then
            npx playwright test tests/web/endToEndShoppingFlow.spec.ts --project=tutorialsninja --project=awesomeqa --workers=1
          else
            npm run "$TEST_SUITE" -- --project=chromium
          fi
        shell: bash
        env:
          CI: "1"
          TEST_SUITE: ${{ inputs.test_suite || 'test:api' }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
